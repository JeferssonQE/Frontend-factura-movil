<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- F mark: paleta exacta variacion-3 -->
    <linearGradient id="fGrad" x1="36" y1="39" x2="118" y2="161" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#70D4FF"/>
      <stop offset="35%"  stop-color="#0044FF"/>
      <stop offset="100%" stop-color="#001266"/>
    </linearGradient>

    <!-- Marco azul IA: gradiente diagonal variacion-3 -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4DC8FF"/>
      <stop offset="45%"  stop-color="#0044FF"/>
      <stop offset="100%" stop-color="#001266"/>
    </linearGradient>

    <!-- Wash blanco-azul muy sutil dentro (eco del banner) -->
    <linearGradient id="bgWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F5F9FF"/>
      <stop offset="100%" stop-color="#EBF2FF"/>
    </linearGradient>

    <!-- Glow sutil del F mark adaptado a fondo blanco -->
    <filter id="fShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#0044FF" flood-opacity="0.28" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow del marco exterior (efecto IA brillante) -->
    <filter id="borderGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#0044FF" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot glow -->
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Marco exterior con gradiente azul IA (4px de borde) -->
  <rect width="200" height="200" rx="44" fill="url(#borderGrad)" filter="url(#borderGlow)"/>

  <!-- Fondo blanco interior (inset 4px) -->
  <rect x="4" y="4" width="192" height="192" rx="40" fill="url(#bgWash)"/>

  <!-- F mark con glow suave sobre blanco -->
  <g filter="url(#fShadow)">
    <rect x="36" y="38" width="19" height="124" rx="9.5" fill="url(#fGrad)"/>
    <rect x="36" y="38" width="82" height="19"  rx="9.5" fill="url(#fGrad)"/>
    <rect x="36" y="89" width="65" height="19"  rx="9.5" fill="url(#fGrad)"/>
  </g>

  <!-- Signal arcs — paleta variacion-3, visibles sobre blanco -->
  <path d="M 118,80 A 19,19 0 0,1 118,120"
        fill="none" stroke="#0044FF" stroke-width="5.5" stroke-linecap="round" opacity="1"/>
  <path d="M 118,65 A 34,34 0 0,1 118,135"
        fill="none" stroke="#1A6AFF" stroke-width="4"   stroke-linecap="round" opacity="0.65"/>
  <path d="M 118,50 A 49,49 0 0,1 118,150"
        fill="none" stroke="#4DC8FF" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Dot origen -->
  <circle cx="118" cy="100" r="5" fill="#0044FF" filter="url(#dotGlow)"/>
</svg>
